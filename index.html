<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricehop Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="logo">PRICEHOP</div>
    </nav>
    <div id="progress-bar"></div>

    <main>
        <section class="section hero">
            <h1 class="title">PRICEHOP</h1>
            <h2 class="subtitle">WE DON'T JUST COMPARE, WE VALUE.</h2>
        </section>

        <!-- Long scroll track for scrollytelling -->
        <div class="mobile-sticky-container" id="scrolly-container">
            
            <div class="phone-mockup-wrapper">
                <div class="phone-frame">
                    
                    <!-- 11 Sequential Screens -->
                    <div class="screen-container" id="screen-0"><img src="assets/hero.png" class="screen-img" alt="Hero"></div>
                    <div class="screen-container" id="screen-1"><img src="assets/First_phone_mesh/ezgif-frame-001.jpg" class="screen-img" alt="First Mesh"></div>
                    <div class="screen-container" id="screen-2"><img src="assets/Second_phone_mesh/ezgif-frame-107.jpg" class="screen-img" alt="Second Mesh"></div>
                    <div class="screen-container" id="screen-3"><img src="assets/ip1.png" class="screen-img" alt="Carousel 1"></div>
                    <div class="screen-container" id="screen-4"><img src="assets/ip2.png" class="screen-img" alt="Carousel 2"></div>
                    <div class="screen-container" id="screen-5"><img src="assets/ip3.png" class="screen-img" alt="Carousel 3"></div>
                    <div class="screen-container" id="screen-6"><img src="assets/ip4.png" class="screen-img" alt="Carousel 4"></div>
                    <div class="screen-container" id="screen-7"><img src="assets/Third_phone_mesh/ezgif-frame-001.jpg" class="screen-img" alt="Third Mesh"></div>
                    <div class="screen-container" id="screen-8"><img src="assets/Fourth_phone_mesh/ezgif-frame-053.jpg" class="screen-img" alt="Fourth Mesh"></div>
                    <div class="screen-container" id="screen-9"><img src="assets/Pr_comp/P_comp.png" class="screen-img" alt="Compare"></div>
                    <div class="screen-container" id="screen-10"><img src="assets/Pr_alert/P_alert.png" class="screen-img" alt="Alert"></div>

                </div>
            </div>

        </div>

        <section class="section footer-section">
            <div class="ticker-wrap">
                <div class="ticker">
                    <div class="ticker__item">🔥 iPhone 15 Pro - Price Dropped ₹5000</div>
                    <div class="ticker__item">🔥 Sony WH-1000XM5 - Lowest Price Today</div>
                    <div class="ticker__item">🔥 MacBook Air M2 - Save 15%</div>
                </div>
            </div>

            <div class="countdown-container">
                <div class="countdown-item"><span id="days">00</span>Days</div>
                <div class="countdown-item"><span id="hours">00</span>Hours</div>
                <div class="countdown-item"><span id="minutes">00</span>Minutes</div>
                <div class="countdown-item"><span id="seconds">00</span>Seconds</div>
            </div>

            <div class="waitlist-form">
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Notify Me</button>
            </div>

            <footer class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Disclosures</a>
                <a href="#">Copyright © 2026 Pricehop</a>
            </footer>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
