<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricehop Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-navbar">
        <div class="logo">PRICEHOP</div>
    </nav>
    <div id="progress-bar"></div>

    <main>
        <section class="section hero">
            <h1 class="title">PRICEHOP</h1>
            <h2 class="subtitle">WE DON'T JUST COMPARE, WE VALUE.</h2>
        </section>

        <!-- Long scroll track for scrollytelling -->
        <div class="mobile-sticky-container" id="scrolly-container">
            
            <div class="phone-mockup-wrapper">
                
                <!-- Popouts that go BEHIND the phone (Step 9/10) -->
                <img src="assets/pop out 1.png" class="pop-behind left" alt="">
                <img src="assets/pop out 2.png" class="pop-behind right" alt="">

                <div class="phone-frame">
                    
                    <!-- Step 0: Hero Screen -->
                    <div class="screen-container" id="screen-hero">
                        <img src="assets/hero.png" class="screen-img" alt="Hero">
                    </div>

                    <!-- Step 1-4: First Mesh & Popouts -->
                    <div class="screen-container" id="screen-first">
                        <img src="assets/First_phone_mesh/ezgif-frame-001.jpg" class="screen-img" alt="First Mesh">
                        <img src="assets/drow.png" class="popout-element" id="pop-drow" alt="Drow">
                        <img src="assets/dday.png" class="popout-element" id="pop-dday" alt="Dday">
                        <img src="assets/shoe_card.png" class="popout-element" id="pop-shoe" alt="Shoe">
                    </div>

                    <!-- Step 5: Second Mesh -->
                    <div class="screen-container" id="screen-second">
                        <img src="assets/Second_phone_mesh/ezgif-frame-107.jpg" class="screen-img" alt="Second Mesh">
                    </div>

                    <!-- Step 6: Carousel -->
                    <div class="screen-container" id="screen-carousel">
                        <div class="carousel-grid">
                            <img src="assets/ip1.png" alt="Phone 1">
                            <img src="assets/ip2.png" alt="Phone 2">
                            <img src="assets/ip3.png" alt="Phone 3">
                            <img src="assets/ip4.png" alt="Phone 4">
                        </div>
                    </div>

                    <!-- Step 7: Third Mesh -->
                    <div class="screen-container" id="screen-third">
                        <img src="assets/Third_phone_mesh/ezgif-frame-001.jpg" class="screen-img" alt="Third Mesh">
                    </div>

                    <!-- Step 8: Fourth Mesh -->
                    <div class="screen-container" id="screen-fourth">
                        <img src="assets/Fourth_phone_mesh/ezgif-frame-053.jpg" class="screen-img" alt="Fourth Mesh">
                    </div>

                    <!-- Step 9-10: Split Screen -->
                    <div class="screen-container" id="screen-split">
                        <div class="split-screen-container">
                            <div class="split-half">
                                <img src="assets/Pr_comp/P_comp.png" class="split-img" alt="Compare">
                                <img src="assets/cmp_popout.png" class="pop-front" id="pop-cmp" alt="Compare Popout">
                            </div>
                            <div class="split-half">
                                <img src="assets/Pr_alert/P_alert.png" class="split-img" alt="Alert">
                                <img src="assets/alert_popout.png" class="pop-front" id="pop-alert" alt="Alert Popout">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <section class="section footer-section">
            <div class="ticker-wrap">
                <div class="ticker">
                    <div class="ticker__item">🔥 iPhone 15 Pro - Price Dropped ₹5000</div>
                    <div class="ticker__item">🔥 Sony WH-1000XM5 - Lowest Price Today</div>
                    <div class="ticker__item">🔥 MacBook Air M2 - Save 15%</div>
                </div>
            </div>

            <div class="countdown-container">
                <div class="countdown-item"><span id="days">00</span>Days</div>
                <div class="countdown-item"><span id="hours">00</span>Hours</div>
                <div class="countdown-item"><span id="minutes">00</span>Minutes</div>
                <div class="countdown-item"><span id="seconds">00</span>Seconds</div>
            </div>

            <div class="waitlist-form">
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Notify Me</button>
            </div>

            <footer class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Disclosures</a>
                <a href="#">Copyright © 2026 Pricehop</a>
            </footer>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
