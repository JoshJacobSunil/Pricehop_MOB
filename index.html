<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricehop - 3D Experience</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <!-- The WebGL Canvas for 3D Model -->
  <canvas id="webgl-canvas"></canvas>
  <!-- Popup image moved outside scroll container to allow true z-index sorting with the canvas -->
  <img id="popup-image" src="/src/assets/shoe_card.png" alt="Popup Image"
    style="position: fixed; top: 50%; left: 50%; transform: scale(1.15); opacity: 0; max-height: 70vh; z-index: 0; pointer-events: none;" />
  <img id="dealsrow-popup" src="/src/assets/dealsrow_poput.png" alt="Dealsrow Popup"
    style="position: fixed; top: 50%; left: 50%; transform: scale(1.15); opacity: 0; max-height: 70vh; z-index: 0; pointer-events: none;" />
  <img id="popout-1" src="/src/assets/pop out 1.png" alt="Popout 1"
    style="position: fixed; top: calc(50% + 5px); left: 50%; transform: scale(1.2); opacity: 0; max-height: 70vh; z-index: 0; pointer-events: none;" />
  <img id="popout-2" src="/src/assets/pop out 2.png" alt="Popout 2"
    style="position: fixed; top: calc(50% + 5px); left: 50%; transform: scale(1.2); opacity: 0; max-height: 70vh; z-index: 0; pointer-events: none;" />

  <!-- Scrollable content sections -->
  <main class="scroll-container">
    <section class="section hero" id="section-1">
      <div class="content-wrapper">
        <h1 class="title" style="font-size: 7rem; z-index: 10;">Pricehop</h1>
        <h2 class="subtitle" style="font-size: 2rem; z-index: 10;">WE DON'T JUST COMPARE, WE VALUE.</h2>
      </div>
    </section>

    <section class="section" id="section-2">
      <div class="content-wrapper align-right">
      </div>
    </section>

    <!-- NEW SECTION for middle screen and blur popup -->
    <section class="section" id="section-2b">
      <div class="content-wrapper">
      </div>
    </section>

    <section class="section split-section" id="section-3">
      <div class="content-wrapper split-left">
      </div>
      <div class="content-wrapper split-right">
      </div>
    </section>

    <section class="section" id="section-4" style="height: 200vh;">
      <div class="content-wrapper align-left" style="margin-left: 10vw;">
      </div>
    </section>

    <section class="section" id="section-5" style="height: 200vh;">
      <div class="content-wrapper align-right">
      </div>
    </section>

    <section class="section" id="section-6">
      <div class="content-wrapper align-right">
      </div>
    </section>

    <section class="section" id="section-7" style="height: 150vh;">
      <div class="content-wrapper">
      </div>
    </section>

    <footer class="section about-us" id="section-about">
      <div class="content-wrapper">
      </div>
    </footer>
  </main>

  <script type="module" src="/main.js"></script>
</body>

</html>
